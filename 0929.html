<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地方美食列表</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        h1{
            margin-top: 30px;
            text-align: center;
            color: #333;
            font-size: 36px;
            font-weight: bold;
        }

        .wrapper{
            width: 1024px;
            margin: 30px auto;

            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .demo{
            width: calc(33.333% - 14px);
            background-color: white;

            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 3px 10px #ccc;

            transition: 0.3s;
        }

        .demo:hover{
            transform: translateY(-5px);
            box-shadow: 0 6px 15px #aaa;
        }

        .demo img{
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .demo p{
            padding-left: 15px;
            padding-right: 15px;
            margin-top: 10px;

            color: #555;
            font-size: 16px;
        }

        .demo p:first-of-type{
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .demo p:last-of-type{
            margin-bottom: 15px;
        }

        @media screen and (max-width: 1024px){

            .wrapper{
                width: 94%;
            }

            .demo{
                width: calc(50% - 10px);
            }
        }

        @media screen and (max-width: 600px){

            .demo{
                width: 100%;
            }

            h1{
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <h1>地方美食列表</h1>

    <div class="wrapper" id="foodlist">
    </div>

    <script src="jquery-4.0.0.js"></script>
    <script src="TravelFood.js"></script>

    <script>

        console.log(food);

        food.forEach(function(item) {

            $("#foodlist").append(
                '<div class="demo">' +
                    '<img src="' + item.PicURL + '">' +
                    '<p>店家：' + item.Name + '</p>' +
                    '<p>電話：' + item.Tel + '</p>' +
                '</div>'
            );

        });

    </script>

</body>
</html>
