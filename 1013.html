<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        .box {
            height: 180px;
        }

        .roller-t {
            position: relative;
        }

        .roller-t .rollerbox-t {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(223, 126, 30, 0.9);
            transform: translateY(-100%);
            transition: transform 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roller-t:hover .rollerbox-t {
            transform: translateX(0);
        }

        .roller-B {
            position: relative;
        }

        .roller-B .rollerbox-B {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(223, 126, 30, 0.9);
            transform: translateY(100%);
            transition: transform 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roller-B:hover .rollerbox-B {
            transform: translateX(0);
        }

        .roller-L {
            position: relative;
        }

        .roller-L .rollerbox-L {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(223, 126, 30, 0.9);
            transform: translateX(-100%);
            transition: transform 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roller-L:hover .rollerbox-L {
            transform: translateX(0);
        }

        .roller-R {
            position: relative;
        }

        .roller-R .rollerbox-R {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(223, 126, 30, 0.9);
            transform: translateX(100%);
            transition: transform 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roller-R:hover .rollerbox-R {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-6 mt-3">
                <div class="box bg-info roller-t">
                    <div class="rollerbox-t">始終人物看出幾天化。</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6 mt-3">
                <div class="box bg-info roller-B">
                    <div class="rollerbox-B">始終人物看出幾天化。</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6 mt-3">
                <div class="box bg-info roller-L">
                    <div class="rollerbox-L">始終人物看出幾天化。</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6 mt-3">
                <div class="box bg-info roller-R">
                    <div class="rollerbox-R">始終人物看出幾天化。</div>
                </div>
            </div>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
</body>

</html>
