<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-時間軸</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="myall.css">
    <style>
        .imgbox {
            height: 220px;

        }
        .timeline-section{
            position: relative;
        }

        .timeline-section::before {
            position: absolute;
            content: "";
            width: 5px;
            background-color: rgba(100, 100, 100, 0.5);
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .timeline-section-pointer{
            position: relative;
        }
        .timeline-section-pointer::before{
            position: absolute;
            content:"";
            width: 30px;
            height: 30px;
            background-color: rgba(30, 108, 25, 0.5);
            border-radius: 50%;
            border: 8px solid rgba(28, 31, 125, 0.5);
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        @media screen and(max-width: 768px){
            .timeline-section::before{
                left: -20px;
            }
            .timeline-section-pointer::before{
                left: -10px;
            }
        }
        .roller-t{
            position: relative;
        }
        .rollerbox-t{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(100, 100, 100, 0.5);
            transform: translateX(-10);
            transition: transform 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="display-2 text-center fw-900 my-4">時間軸(timeline)</div>
        <div class="timeline-section">
            <div class="row align-items-center timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox bg-img roller-t" style="background-image: url(image/0923-01.avif);">
                        <div class="rollerbox-t">
                            <button class="btn btn-warning">查看更多</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-center">
                    <div class="h2 fw-900">標題</div>
                    <p>發貼立場宜蘭數字轉變是在怪物僅僅製作也。</p>
                    <p>以外新手人數，進口改造，室內自己攻擊也。</p>
                </div>
            </div>
            <div class="row mt-3 flex-row-reverse align-items-center timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox bg-img" style="background-image: url(image/0923-01.avif);"></div>
                </div>
                <div class="col-md-6 text-center">

                    <p>發貼立場宜蘭數字轉變是在怪物僅僅製作也。</p>
                    <p>以外新手人數，進口改造，室內自己攻擊也。</p>
                </div>
            </div>

                </div>
                <div class="col-md-6 text-center">
                    <div class="h2 fw-900">標題</div>
                    <p>發貼立場宜蘭數字轉變是在怪物僅僅製作也。</p>
                    <p>以外新手人數，進口改造，室內自己攻擊也。</p>
                </div>
            </div>
            <div class="row mt-3 flex-row-reverse align-items-center timeline-section-pointer">
                <div class="col-md-6">
                    <div class="imgbox bg-img" style="background-image: url(image/0923-01.avif);"></div>
                </div>
                <div class="col-md-6 text-center">

                    <p>發貼立場宜蘭數字轉變是在怪物僅僅製作也。</p>
                    <p>以外新手人數，進口改造，室內自己攻擊也。</p>
                </div>

        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
</body>

</html>
