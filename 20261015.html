<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="myall.css">
</head>

<body>
    <div class="container">
        <div class="display-2 fw-900 text-center mt4 text-bg-success p-3">ch-8.Forms(表單)</div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">1.基本表單樣式</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">帳號</label>
                    <input type="text" class="form-control" id="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-lg" id="email">
                </div>
                <div class="mb-3">
                    <label for="num" class="form-label">人數</label>
                    <input type="number" class="form-control form-control-lg" id="num" min="0" max="10" value="1">
                </div>
                <div class="mb-3">
                    <label for="formfile" class="form-label">Email</label>
                    <input type="file" class="form-control form-control-lg" id="formfile">
                </div>
                <div>
                    <label for="foodlist" class="form-label">點餐</label>
                    <input type="text" class="form-control" id="foodlist" list="datalistoption">
                    <datalist id="datalistoption">
                        <option value="漢堡"></option>
                        <option value="薯條"></option>
                        <option value="壽司"></option>
                        <option value="牛肉麵"></option>
                    </datalist>
                </div>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">2.Select</div>
        <div class="row">
            <div class="col-12">
                <select name="" id="" class="form-select form-select-lg">
                    <option value="台中市">台中市</option>
                    <option value="彰化市">彰化市</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="臺南市">臺南市</option>
                </select>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">3.checkbox(單選) radio(複選)</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="my" id="chk01">
                    <label for="chk01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="my" id="chk02">
                    <label for="chk02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="my" id="chk03">
                    <label for="chk03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="my" id="chk04">
                    <label for="chk04" class="form-check-label">選項04</label>
                </div>>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="my" id="rad01">
                    <label for="rad01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="my" id="rad02">
                    <label for="rad02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="my" id="rad03">
                    <label for="rad03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="my" id="rad04">
                    <label for="rad04" class="form-check-label">選項04</label>
                </div>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">4.Switch</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="" id="">
                    <label for="" class="form-check-label">開燈/關燈</label>
                </div>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">5.range</div>
        <div class="mb-3">
            <label for="range01" class="form-label">數量</label>
            <input type="range" class="form-range" min="1" max="100" step="1" value="100" id="range01">
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">6.input-group</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="1" max="1000" class="form-control">
                    <span class="input-group-text">NT</span>
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3">
                    <input type="text" class="form-control form-control-lg" name="" id="">
                    <button class="btn btn-primary">搜尋</button>
                </div>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">7.floating labels(浮動標籤)</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 form-floating">
                    <input type="text" class="form-control form-control-lg" placeholder="XXXXXXX">
                    <label for="username" class="form-label">帳號</label>
                </div>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">8.表單驗證</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">帳號</label>
                    <input type="text" class="form-control" id="username" placeholder="請輸入一個大寫英文...">
                    <div class="vaild-feedback">帳號輸入符合規定</div>
                    <div class="invaild-feedback">帳號輸入不符合規定</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="text" class="form-control" id="password">
                    <div class="vaild-feedback">密碼輸入符合規定</div>
                    <div class="invaild-feedback">密碼輸入不符合規定</div>
                </div>
            </div>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
</body>

</html>
